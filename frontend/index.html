<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RailTrack — Sign In</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .login-bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .decor-track {
      position: absolute;
      background: rgba(255,255,255,0.04);
      transform: rotate(-15deg);
    }
    .decor-track:nth-child(1) { width: 6px; height: 200%; top: -50%; left: 15%; }
    .decor-track:nth-child(2) { width: 6px; height: 200%; top: -50%; left: 16.2%; }
    .decor-track:nth-child(3) { width: 6px; height: 200%; top: -50%; right: 20%; }
    .decor-track:nth-child(4) { width: 6px; height: 200%; top: -50%; right: 21.2%; }
    .decor-cross { position: absolute; background: rgba(232,160,32,0.08); transform: rotate(-15deg); }
    .decor-cross:nth-child(5)  { width: 80px; height: 4px; top: 25%; left: 11%; }
    .decor-cross:nth-child(6)  { width: 80px; height: 4px; top: 40%; left: 11%; }
    .decor-cross:nth-child(7)  { width: 80px; height: 4px; top: 55%; left: 11%; }
    .decor-cross:nth-child(8)  { width: 80px; height: 4px; top: 70%; left: 11%; }
    .decor-cross:nth-child(9)  { width: 80px; height: 4px; top: 25%; right: 16%; }
    .decor-cross:nth-child(10) { width: 80px; height: 4px; top: 40%; right: 16%; }
    .decor-cross:nth-child(11) { width: 80px; height: 4px; top: 55%; right: 16%; }
    .decor-cross:nth-child(12) { width: 80px; height: 4px; top: 70%; right: 16%; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-bg-decor">
      <div class="decor-track"></div><div class="decor-track"></div>
      <div class="decor-track"></div><div class="decor-track"></div>
      <div class="decor-cross"></div><div class="decor-cross"></div>
      <div class="decor-cross"></div><div class="decor-cross"></div>
      <div class="decor-cross"></div><div class="decor-cross"></div>
      <div class="decor-cross"></div><div class="decor-cross"></div>
    </div>

    <div class="login-card">
      <div class="login-logo">
        <div class="mark">Rail<span>Track</span></div>
        <div class="sub">Asset Management System</div>
      </div>
      <div class="rail-stripe"></div>

      <div class="login-tabs">
        <div class="login-tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
        <div class="login-tab" id="tab-register" onclick="switchTab('register')">Register</div>
      </div>

      <!-- LOGIN FORM -->
      <div id="login-form">
        <div class="form-group">
          <label>Email Address <span class="req">*</span></label>
          <input type="email" id="login-email" placeholder="you@railway.gov.in" autocomplete="email"/>
        </div>
        <div class="form-group">
          <label>Password <span class="req">*</span></label>
          <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password"/>
        </div>
        <button class="btn btn-primary w-full" id="btn-login" onclick="doLogin()">
          Sign In
        </button>
      </div>

      <!-- REGISTER FORM -->
      <div id="register-form" class="hidden">
        <div class="form-group">
          <label>Full Name <span class="req">*</span></label>
          <input type="text" id="reg-name" placeholder="Your full name"/>
        </div>
        <div class="form-group">
          <label>Email Address <span class="req">*</span></label>
          <input type="email" id="reg-email" placeholder="you@railway.gov.in"/>
        </div>
        <div class="form-group">
          <label>Password <span class="req">*</span></label>
          <input type="password" id="reg-password" placeholder="Min. 6 characters"/>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="reg-role">
            <option value="viewer">Viewer (read-only)</option>
            <option value="inspector">Inspector (can add/edit)</option>
            <option value="admin">Admin (full access)</option>
          </select>
          <div class="field-error" style="color:var(--grey-500);margin-top:4px;font-size:0.74rem;">
            ℹ The first registered user automatically becomes Admin.
          </div>
        </div>
        <button class="btn btn-gold w-full" id="btn-register" onclick="doRegister()">
          Create Account
        </button>
      </div>

      <p style="text-align:center;font-size:0.76rem;color:var(--grey-500);margin-top:20px;">
        🔒 Secured with JWT + bcrypt encryption
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) window.location.href = 'pages/dashboard.html';

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
    }

    async function doLogin() {
      const btn = document.getElementById('btn-login');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return Toast.error('Please fill in all fields.');

      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span> Signing in…';

      const res = await API.post('/auth/login', { email, password });
      if (res?.ok) {
        Auth.setSession(res.data.token, res.data.user);
        Toast.success('Welcome back, ' + res.data.user.name + '!');
        setTimeout(() => window.location.href = 'pages/dashboard.html', 800);
      } else {
        Toast.error(res?.data?.message || 'Login failed.');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }

    async function doRegister() {
      const btn = document.getElementById('btn-register');
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const role = document.getElementById('reg-role').value;
      if (!name || !email || !password) return Toast.error('Please fill in all required fields.');
      if (password.length < 6) return Toast.error('Password must be at least 6 characters.');

      btn.disabled = true;
      btn.innerHTML = '<span class="loader loader-dark"></span> Creating account…';

      const res = await API.post('/auth/register', { name, email, password, role });
      if (res?.ok) {
        Auth.setSession(res.data.token, res.data.user);
        Toast.success('Account created! Welcome, ' + res.data.user.name + '!');
        setTimeout(() => window.location.href = 'pages/dashboard.html', 800);
      } else {
        Toast.error(res?.data?.message || 'Registration failed.');
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    }

    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (!document.getElementById('login-form').classList.contains('hidden')) doLogin();
        else doRegister();
      }
    });
  </script>
</body>
</html>
