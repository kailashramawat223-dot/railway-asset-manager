<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RailTrack — Dashboard</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">📊 Dashboard</div>
      <div class="topbar-actions">
        <a href="alerts.html" class="btn btn-ghost btn-sm" id="alert-bell" style="position:relative">
          🔔 Alerts <span id="alert-count" style="display:none;position:absolute;top:-4px;right:-4px;background:var(--signal-red);color:white;border-radius:10px;font-size:0.65rem;padding:2px 5px;font-weight:700"></span>
        </a>
        <span class="text-sm text-muted" id="topbar-date"></span>
      </div>
    </header>

    <main class="page-body">
      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-icon navy">🚂</div><div><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total Assets</div></div></div>
        <div class="stat-card"><div class="stat-icon green">✅</div><div><div class="stat-value" id="stat-operational">—</div><div class="stat-label">Operational</div></div></div>
        <div class="stat-card"><div class="stat-icon yellow">🔧</div><div><div class="stat-value" id="stat-maintenance">—</div><div class="stat-label">Under Maintenance</div></div></div>
        <div class="stat-card"><div class="stat-icon red">⚠️</div><div><div class="stat-value" id="stat-faulty">—</div><div class="stat-label">Faulty</div></div></div>
        <div class="stat-card"><div class="stat-icon gold">📦</div><div><div class="stat-value" id="stat-standby">—</div><div class="stat-label">Standby</div></div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
        <!-- Category Breakdown -->
        <div class="card">
          <div class="card-header"><span class="card-title">Assets by Category</span></div>
          <div class="card-body" id="category-chart" style="min-height:200px"></div>
        </div>
        <!-- Recent Assets -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Recently Added</span>
            <a href="assets.html" class="btn btn-ghost btn-sm">View All</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Category</th></tr></thead>
              <tbody id="recent-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="card">
        <div class="card-header"><span class="card-title">Quick Actions</span></div>
        <div class="card-body" style="display:flex;gap:12px;flex-wrap:wrap">
          <a href="assets.html?action=new" class="btn btn-primary">➕ Add New Asset</a>
          <a href="scan.html" class="btn btn-gold">⬛ Scan QR Code</a>
          <a href="assets.html" class="btn btn-ghost">📋 View All Assets</a>
          <a href="maintenance.html" class="btn btn-ghost">🔧 Maintenance Log</a>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  if (!Auth.requireAuth()) throw new Error('Redirecting');
  renderSidebar('dashboard');

  document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('en-IN', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  async function loadDashboard() {
    const [statsRes, assetsRes] = await Promise.all([
      API.get('/assets/stats'),
      API.get('/assets?limit=5&page=1')
    ]);

    if (statsRes?.ok) {
      const { total, byStatus, byCategory } = statsRes.data;
      document.getElementById('stat-total').textContent = total;

      const statusMap = {};
      byStatus.forEach(s => statusMap[s._id] = s.count);
      document.getElementById('stat-operational').textContent = statusMap['Operational'] || 0;
      document.getElementById('stat-maintenance').textContent = statusMap['Under Maintenance'] || 0;
      document.getElementById('stat-faulty').textContent = statusMap['Faulty'] || 0;
      document.getElementById('stat-standby').textContent = statusMap['Standby'] || 0;

      // Category bars
      const catDiv = document.getElementById('category-chart');
      const maxCount = Math.max(...byCategory.map(c => c.count), 1);
      catDiv.innerHTML = byCategory.length ? byCategory.map(c => `
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:3px">
            <span style="font-weight:600;color:var(--grey-700)">${c._id}</span>
            <span style="color:var(--grey-500)">${c.count}</span>
          </div>
          <div style="background:var(--grey-100);border-radius:4px;height:8px;overflow:hidden">
            <div style="background:var(--navy);height:100%;width:${(c.count/maxCount*100).toFixed(1)}%;border-radius:4px;transition:width 0.6s"></div>
          </div>
        </div>
      `).join('') : '<div class="text-muted text-sm">No data yet.</div>';
    }

    if (assetsRes?.ok) {
      const tbody = document.getElementById('recent-tbody');
      tbody.innerHTML = assetsRes.data.assets.length ? assetsRes.data.assets.map(a => `
        <tr>
          <td class="asset-id-cell">${a.assetId}</td>
          <td><a href="assets.html?id=${a._id}" style="font-weight:600">${a.name}</a></td>
          <td>${Format.statusBadge(a.status)}</td>
          <td class="text-sm text-muted">${a.category}</td>
        </tr>
      `).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--grey-500);padding:24px">No assets yet.</td></tr>';
    }
  }

  loadDashboard();

  // Load alert count for bell
  API.get('/notifications').then(res => {
    if (res?.ok && res.data.count > 0) {
      const el = document.getElementById('alert-count');
      el.textContent = res.data.count;
      el.style.display = 'inline';
    }
  });
</script>
</body>
</html>
